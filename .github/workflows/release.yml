name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build darwin binaries
        run: |
          ver="${GITHUB_REF_NAME}"
          ldflags="-s -w -X main.Version=${ver}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$ldflags" \
            -o volatile-downloads-darwin-arm64 ./cmd/volatile-downloads
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$ldflags" \
            -o volatile-downloads-darwin-amd64 ./cmd/volatile-downloads

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME}"
          if gh release view "${ver}" >/dev/null 2>&1; then
            echo "release ${ver} already exists — not overwriting assets (CI builds are unsigned)"
            exit 0
          fi
          gh release create "${ver}" \
            volatile-downloads-darwin-arm64 \
            volatile-downloads-darwin-amd64 \
            --title "volatile-downloads ${ver}" \
            --generate-notes
